<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>HousePlan — планировка дома и участка</title>
    <meta name="description" content="Планировщик дома в браузере: участок, стены, окна и двери, этажи, лестницы, крыши и мебель. План и 3D одновременно, на компьютере и телефоне." />
    <meta name="theme-color" content="#fbfcfc" id="meta-theme" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HousePlan" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/editor.css" />
    <link rel="stylesheet" href="css/mobile.css" />
    <script>
      // тема до отрисовки — без вспышки светлого фона
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('houseplan.settings.v1') || '{}');
          var t = s.theme || 'system';
          if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.min.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#plan-host">Перейти к плану</a>
    <div class="app" id="app">
      <header class="topbar" id="topbar"></header>
      <nav class="rail" id="rail" aria-label="Инструменты"></nav>

      <main class="stage" id="stage" data-view="plan">
        <section class="pane pane-plan" id="pane-plan" aria-label="План">
          <div class="plan-host" id="plan-host"></div>
          <div class="tool-options" id="tool-options" hidden></div>
          <div class="empty-state" id="empty-state" hidden></div>
          <div class="zoom-ctrl" id="zoom-ctrl"></div>
        </section>
        <section class="pane pane-3d" id="pane-3d" aria-label="3D-вид">
          <div class="view3d-host" id="view3d-host"></div>
          <div class="view3d-bar" id="view3d-bar"></div>
          <div class="view3d-loading" aria-hidden="true">Загружаю 3D…</div>
        </section>
        <div class="hint-pill" id="hint-pill" role="status" aria-live="polite" hidden></div>
        <div class="selection-bar" id="selection-bar" role="toolbar" aria-label="Действия с выделенным" hidden></div>
      </main>

      <aside class="side" id="side" aria-label="Этажи, свойства и каталог"></aside>
      <footer class="statusbar" id="statusbar"></footer>
      <nav class="bottombar" id="bottombar" aria-label="Инструменты"></nav>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div id="modal-root"></div>
    <div id="popover-root"></div>

    <div class="boot-error" id="boot-error" hidden>
      <h1>Откройте приложение через веб-сервер</h1>
      <p>Браузер не загружает модули из файла на диске. Запустите в папке проекта <code>python -m http.server</code> и откройте <code>http://localhost:8000</code> — или опубликуйте на GitHub Pages.</p>
    </div>
    <noscript>Для работы HousePlan нужен JavaScript.</noscript>
    <script>
      if (location.protocol === 'file:') document.getElementById('boot-error').hidden = false;
    </script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
